repos:
  # prek 内置实现, 不联网、不建环境
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format lint
        entry: xcrun swift-format lint --strict
        language: system
        types: [swift]
