# APP_NAME / BUNDLE_ID / URL_SCHEME / DEVELOPMENT_TEAM 由 justfile 提供; 一律经 just 调用 xcodegen
name: ${APP_NAME}
options:
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Core:
    path: Packages/Core
targets:
  ${APP_NAME}:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Core
      # 加 extension 后在此嵌入, 见下方示例
      # - target: ${APP_NAME}Widget
      #   embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 只在 App target 上: UI 代码默认 MainActor; Core 包保持 nonisolated
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    # 需要 App Group 等能力时启用; group 标识两边 (App 与 extension) 必须一致
    # entitlements:
    #   path: App/App.entitlements
    #   properties:
    #     com.apple.security.application-groups: [group.${BUNDLE_ID}]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${APP_NAME}
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: ${BUNDLE_ID}
            CFBundleURLSchemes: ["${URL_SCHEME}"]
  # extension 示例: 每个 extension 单独占一个 App ID 名额 (免费账号每 7 天最多 10 个)
  # bundle id 必须是 ${BUNDLE_ID}.<ext> 前缀; 源码放在独立目录, 不要放进 App/
  # ${APP_NAME}Widget:
  #   type: app-extension
  #   platform: iOS
  #   sources: [Widget]
  #   dependencies:
  #     - package: Core
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.widget
  #   entitlements:
  #     path: Widget/Widget.entitlements
  #     properties:
  #       com.apple.security.application-groups: [group.${BUNDLE_ID}]
  #   info:
  #     path: Widget/Info.plist
