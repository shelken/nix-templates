# APP_NAME / BUNDLE_ID / URL_SCHEME / DEVELOPMENT_TEAM 由 justfile 提供; 一律经 just 调用 xcodegen
name: ${APP_NAME}
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Core:
    path: Packages/Core
targets:
  ${APP_NAME}:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${APP_NAME}
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: ${BUNDLE_ID}
            CFBundleURLSchemes: ["${URL_SCHEME}"]
