repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format lint
        entry: xcrun swift-format lint --strict
        language: system
        types: [swift]
